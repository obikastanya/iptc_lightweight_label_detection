[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statickd"
version = "1.0.0"
description = "Multilingual IPTC news topic classification at language-identification cost (knowledge distillation into a token-logit table)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Obi Kastanya"}, {name = "Ananta Dwi Prayoga Alwy"}]
dependencies = ["numpy>=1.26", "tokenizers>=0.15", "safetensors>=0.4"]

[project.optional-dependencies]
research = ["pandas>=2.2", "scikit-learn>=1.4", "scipy>=1.11", "matplotlib>=3.8", "torch>=2.2",
            "transformers>=4.44", "huggingface_hub>=0.24", "onnxruntime>=1.18", "onnx>=1.16",
            "fasttext-wheel>=0.9.2", "datasketch>=1.6", "trafilatura>=1.12", "warcio>=1.7",
            "pyarrow>=15", "requests>=2.31", "psutil>=5.9", "joblib>=1.3", "nbclient>=0.10", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"statickd.testset" = ["iptc_reference/*.json", "iptc_reference/*.csv"]
